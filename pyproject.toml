[project]
name = "mcpolish"
version = "0.1.0"
description = "Fast static linter for MCP servers. Catches vague, colliding, or misleading tool descriptions before agents pick the wrong tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vikram Dev" }]
keywords = ["mcp", "model-context-protocol", "linter", "static-analysis", "llm-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "libcst>=1.4.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30.0", "anthropic>=0.25.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcpolish = "mcpolish.cli.main:cli"

[project.urls]
Homepage = "https://github.com/vtensor/mcpolish"
Documentation = "https://mcpolish.dev"
Issues = "https://github.com/vtensor/mcpolish/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpolish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src/mcpolish"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
