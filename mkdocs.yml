site_name: mcpolish
site_description: Static linter for MCP server source code. Catches the description smells that make agents pick the wrong tool.
site_url: https://www.melonai.in/docs/mcpolish/
site_author: Vikram Dev

repo_name: vtensor/mcpolish
repo_url: https://github.com/vtensor/mcpolish
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Vikram Dev

use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Your first lint: getting-started/your-first-lint.md
      - Understanding the output: getting-started/understanding-output.md
  - Concepts:
      - What is MCP: concepts/what-is-mcp.md
      - What is a linter: concepts/what-is-a-linter.md
      - What mcpolish checks: concepts/what-mcpolish-checks.md
      - The rule system: concepts/the-rule-system.md
      - How scoring works: concepts/how-scoring-works.md
      - Glossary: concepts/glossary.md
  - Usage:
      - CLI reference: usage/cli-reference.md
      - Configuration: usage/configuration.md
      - Autofix: usage/autofix.md
      - Output formats: usage/output-formats.md
      - LLM rules: usage/llm-rules.md
      - Python API: usage/python-api.md
  - Rules:
      - Overview: rules/index.md
      - "Schema (MP001 to MP005)":
